name: Sync MarcoTV release

on:
  schedule:
    # 每天 10:00 北京时间检查一次原项目新稳定版
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync latest stable release
        run: python3 scripts/sync_release.py
      - name: Commit and push if changed
        run: |
          git config user.name "mtv-sync"
          git config user.email "mtv-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already up to date, nothing to commit"
          else
            git commit -m "Sync MarcoTV latest stable release"
            git push
          fi
