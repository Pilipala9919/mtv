name: Sync MarcoTV release

on:
  schedule:
    # 每天 10:00 北京时间检查一次原项目新稳定版
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check update sync validation
        run: python3 scripts/test_sync.py
      - name: Sync stable page and both update channels
        run: python3 scripts/sync_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install quark-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/jinhuang712/quark-cli/main/install.sh -o /tmp/quark-install.sh
          bash /tmp/quark-install.sh --no-skill
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync packages to Quark Drive
        continue-on-error: true
        env:
          QUARK_COOKIES_JSON: ${{ secrets.QUARK_COOKIES_JSON }}
        run: |
          mkdir -p ~/.quark-cli
          printf '%s' "$QUARK_COOKIES_JSON" > ~/.quark-cli/profile.cookies.json
          chmod 600 ~/.quark-cli/profile.cookies.json
          quark whoami
          python scripts/sync_quark.py --tv
      - name: Commit and push if changed
        run: |
          git config user.name "mtv-sync"
          git config user.email "mtv-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already up to date, nothing to commit"
          else
            git commit -m "Sync MarcoTV latest stable release"
            git pull --rebase origin main
            git push
          fi
