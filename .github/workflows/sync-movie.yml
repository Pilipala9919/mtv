name: Sync Marco Movie releases
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-movie
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify mirror sync
        run: |
          python scripts/test_movie_mirror.py
          python scripts/test_android_update_packages.py
          python scripts/test_platform_packages.py
          node scripts/test_movie_proxy.mjs
      - name: Sync independent published releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_platform_packages.py --output movie
      - name: Install quark-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/jinhuang712/quark-cli/main/install.sh -o /tmp/quark-install.sh
          bash /tmp/quark-install.sh --no-skill
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync packages to Quark Drive
        continue-on-error: true
        env:
          QUARK_COOKIES_JSON: ${{ secrets.QUARK_COOKIES_JSON }}
        run: |
          mkdir -p ~/.quark-cli
          printf '%s' "$QUARK_COOKIES_JSON" > ~/.quark-cli/profile.cookies.json
          chmod 600 ~/.quark-cli/profile.cookies.json
          quark whoami
          python scripts/sync_quark.py --movie
      - name: Refresh independent release information
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_platform_packages.py --output movie
      - name: Publish changed Movie files
        run: |
          git config user.name 'movie-sync'
          git config user.email 'movie-sync@users.noreply.github.com'
          git add movie/ scripts/quark.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync Marco Movie independent releases'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
