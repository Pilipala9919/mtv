name: Sync Marco Movie platform packages
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-movie
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify mirror sync
        run: python scripts/test_platform_packages.py
      - name: Sync published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_platform_packages.py --output movie
      - name: Publish changed Movie files
        run: |
          git config user.name 'movie-sync'
          git config user.email 'movie-sync@users.noreply.github.com'
          git add movie/
          if ! git diff --cached --quiet; then
            git commit -m 'Sync Marco Movie platform packages'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
